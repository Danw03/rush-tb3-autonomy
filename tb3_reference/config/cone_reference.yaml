reference_node:
  ros__parameters:
    cone_path_topic: /cone_path
    cone_features_topic: /cone_features
    reference_path_topic: /reference_path
    reference_speed_topic: /reference_speed
    driving_mode_topic: /driving_mode

    target_frame: odom
    input_timeout_sec: 0.5
    transform_timeout_sec: 0.05
    allow_latest_transform_fallback: true
    publish_rate_hz: 10.0

    minimum_cone_count: 1
    prepend_robot_origin: true
    minimum_point_separation_m: 0.01
    minimum_path_length_m: 0.05
    maximum_path_length_m: 2.0
    resample_spacing_m: 0.03
    smoothing_window: 3
    reference_speed_mps: 0.03
